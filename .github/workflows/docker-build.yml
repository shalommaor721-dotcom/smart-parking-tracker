name: Docker Build & Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  # ---- CI: verify that everything builds on EVERY push ----
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build all images with Docker Compose
        run: docker compose build

      - name: Smoke test - start the stack and call the API
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf -X POST http://localhost:3000/api/plates \
            -H "Content-Type: application/json" -d '{"plate":"CI-TEST-1"}'
          curl -sf http://localhost:8080/api/plates
          curl -sf http://localhost:8080/ > /dev/null
          docker compose down -v

  # ---- BONUS (+10): publish images to GitHub Container Registry ----
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        include:
          - name: api
            context: ./api
          - name: web
            context: ./web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Secure login to ghcr.io using the built-in GITHUB_TOKEN (no manual secrets)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Automatic tagging: latest, short commit SHA and the version tag (v1.0.0 -> 1.0.0)
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      # 3. Build and push the image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
