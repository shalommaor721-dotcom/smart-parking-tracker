# הקובץ הזה אומר ל-Nginx מה לעשות כשמישהו פונה אליו.
# יש לו שני תפקידים:
#   1. להציג את דפי לוח הבקרה
#   2. להעביר בקשות של נתונים (שמתחילות ב-/api/) לשרת הנתונים

# הגדרות של שרת אחד
server {
    # מקשיב בפורט 80 בתוך התוכנית
    listen 80;
    # התאמה לכל שם של אתר
    server_name _;

    # התיקייה שבה נמצאים הדפים להצגה (לשם העתקנו אותם בקובץ Dockerfile)
    root /usr/share/nginx/html;
    # הדף שמוצג כשנכנסים לכתובת הראשית
    index index.html;

    # כללים לכל כתובת רגילה
    location / {
        # מחפשים קובץ בשם שביקשו. אם אין כזה, מציגים את הדף הראשי
        try_files $uri $uri/ /index.html;
    }

    # כללים לכל כתובת שמתחילה ב-/api/ (בקשות לנתונים)
    location /api/ {
        # מעבירים את הבקשה לשרת הנתונים. המילה api היא השם של התוכנית בקובץ docker-compose.yml.
        # ככה הדפדפן מדבר עם כתובת אחת בלבד, ושרת הנתונים נשאר מוסתר בפנים
        proxy_pass http://api:3000;
        # מגדירים שהחיבור לשרת הנתונים משתמש בגרסה 1.1 של פרוטוקול האינטרנט
        proxy_http_version 1.1;
        # מעבירים לשרת הנתונים את שם האתר שאליו הדפדפן פנה
        proxy_set_header Host $host;
        # מעבירים לשרת הנתונים את הכתובת האמיתית של מי ששלח את הבקשה
        proxy_set_header X-Real-IP $remote_addr;
    }
}
